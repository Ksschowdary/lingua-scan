<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinguaScan — scan, summarise, study</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>Lingua<span>Scan</span></h1>
  <p>Upload a screenshot, photo, PDF or text file of what you're studying. Get a summary, notes to write, and practice questions.</p>
  <p id="ai-status" class="badge"></p>
</header>

<main>
  <section class="card" id="upload-card">
    <div class="controls">
      <label>I'm learning
        <select id="target-lang"></select>
      </label>
      <label>Explain to me in
        <select id="native-lang"></select>
      </label>
      <label>My level
        <select id="level">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>
    </div>

    <div id="dropzone" tabindex="0" role="button" aria-label="Upload a file">
      <input type="file" id="file-input" accept="image/*,.pdf,.txt,.md,.csv,.srt,.vtt" hidden />
      <img id="preview" alt="" hidden />
      <div id="dropzone-text">
        <strong>Drop a file here</strong>
        <span>or click to choose — screenshot, photo, PDF, or text</span>
      </div>
    </div>

    <button id="scan-btn" class="primary" disabled>Scan &amp; create study pack</button>
    <p id="status" class="status" hidden></p>
  </section>

  <section id="results" hidden>
    <h2 id="pack-title"></h2>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="summary">Summary</button>
      <button class="tab" data-tab="notes">Notes to write</button>
      <button class="tab" data-tab="vocab">Vocabulary</button>
      <button class="tab" data-tab="quiz">Practice</button>
      <button class="tab" data-tab="source">Scanned text</button>
    </nav>

    <div class="card panel" id="panel-summary"></div>
    <div class="card panel" id="panel-notes" hidden></div>
    <div class="card panel" id="panel-vocab" hidden></div>
    <div class="card panel" id="panel-quiz" hidden></div>
    <div class="card panel" id="panel-source" hidden></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
